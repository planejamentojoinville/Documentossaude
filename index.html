 const cl=[...CATS,...new Set(D.map(d=>d.c).filter(c=>!CATS.includes(c)))];
 $('cats').innerHTML='<button class="chip '+(S.c?'':'on')+'" data-c="">Todos</button>'+cl.map(c=>'<button class="chip '+(S.c===c?'on':'')+'" data-c="'+E(c)+'">'+E(c)+'<small>'+(cc[c]||0)+'</small></button>').join('');
 const ts=new Set(TAGS);D.forEach(d=>d.g.forEach(g=>ts.add(g)));
 $('tema').innerHTML='<option value="">Todos os temas</option>'+[...ts].sort((a,b)=>a.localeCompare(b,'pt')).map(t=>'<option '+(S.t===t?'selected':'')+'>'+E(t)+'</option>').join('');
 const ys=[...new Set(D.map(d=>d.y).filter(Boolean))].sort().reverse();
 $('ano').innerHTML='<option value="">Todos os anos</option>'+ys.map(y=>'<option '+(S.a===y?'selected':'')+'>'+y+'</option>').join('');
 $('cnt').textContent=r.length+' de '+D.length+' documentos';
 $('list').innerHTML=r.length?r.map(d=>'<div class="card'+(d.x?' ex':'')+'"><div class="b"><div class="cat">'+E(d.c)+(d.n?'<span class="new">novo</span>':'')+(d.y?' · '+d.y:'')+'</div><div class="ti">'+hl(d.t,ws)+'</div><div class="tg">'+d.g.map(g=>'<span data-t="'+E(g)+'">'+E(g)+'</span>').join('')+'</div></div><div class="act">'+(d.l?'<a class="btn s" target="_blank" rel="noopener" href="'+E(d.l)+'">Abrir documento</a>':'<span class="nolink">sem link cadastrado</span>')+(EDITAR?(d.x?'<button class="btn s o" data-r="'+d.i+'">Restaurar</button>':'<button class="btn s o" data-e="'+d.i+'">Editar</button><button class="btn s o dn" data-d="'+d.i+'">Excluir</button>'):'')+'</div></div>').join(''):'<p style="color:var(--mut)">Nenhum documento encontrado. Tente menos palavras ou limpe os filtros.</p>';
}
$('q').oninput=e=>{S.q=e.target.value;render()};
$('cats').onclick=e=>{const b=e.target.closest('[data-c]');if(b){S.c=b.dataset.c;render()}};
$('list').onclick=e=>{const g=e.target.closest('[data-t]');if(g){S.t=g.dataset.t;render();scrollTo(0,0)}const b=e.target.closest('[data-e]');if(b&&EDITAR)open(b.dataset.e);const x=e.target.closest('[data-d]');if(x&&EDITAR)remove(x.dataset.d);const r=e.target.closest('[data-r]');if(r&&EDITAR)restore(r.dataset.r)};
$('tema').onchange=e=>{S.t=e.target.value;render()};$('ano').onchange=e=>{S.a=e.target.value;render()};
$('lk').onchange=e=>{S.lk=e.target.value;render()};$('ord').onchange=e=>{S.o=e.target.value;render()};
$('lim').onclick=()=>{S={q:'',c:'',t:'',a:'',lk:'',o:'r',x:false};$('xx').checked=false;$('q').value='';$('lk').value='';$('ord').value='r';render()};
function open(id){edit=id;const d=id?all().find(x=>x.i===id):{t:'',c:CATS[0],l:'',g:[],y:''};
 $('dt').textContent=id?'Editar documento':'Novo documento';$('f_t').value=d.t;$('f_l').value=d.l||'';$('f_y').value=d.y||'';
 $('f_c').innerHTML=CATS.map(c=>'<option '+(c===d.c?'selected':'')+'>'+E(c)+'</option>').join('');
 const ts=new Set(TAGS);$('f_g').innerHTML=[...ts].map(t=>'<label><input type="checkbox" value="'+E(t)+'" '+(d.g.includes(t)?'checked':'')+'>'+E(t)+'</label>').join('');
 $('dg').showModal()}
if(EDITAR){$('add').style.display='';$('shx').style.display='inline-block'}
$('xx').onchange=e=>{S.x=e.target.checked;render()};
$('add').onclick=()=>open(null);$('cx').onclick=()=>$('dg').close();
async function put(coll,id,data){if(db){try{await db.collection(coll).doc(id).set(data);return}catch(e){$('st').textContent='Sem permissão para gravar no banco compartilhado; salvo só neste navegador.'}}
 (coll==='nv'?nv:ov)[id]=data;sv();render()}
$('fm').onsubmit=async()=>{const v={t:$('f_t').value.trim(),c:$('f_c').value,l:$('f_l').value.trim(),y:$('f_y').value.trim(),g:[...document.querySelectorAll('#f_g input:checked')].map(x=>x.value)};
 if(!v.t)return;if(edit)await put(edit[0]==='b'?'ov':'nv',edit,v);else await put('nv','n'+Date.now().toString(36),v)};
async function remove(id){const d=all().find(x=>x.i===id);if(!d||!confirm('Excluir este documento?\n\n'+d.t))return;
 if(id[0]==='b'){const v={...(ov[id]||{}),x:1};await put('ov',id,v)}
 else{if(db)try{await db.collection('nv').doc(id).delete()}catch(e){}delete nv[id];sv();render()}}
async function restore(id){const v={...(ov[id]||{})};delete v.x;await put('ov',id,v)}
$('exp').onclick=async()=>{const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
 const csv='\ufeffTipo,Título,Temas,Ano,Link\r\n'+all().filter(d=>!d.x).map(d=>[d.c,d.t,d.g.join('; '),d.y,d.l].map(q).join(',')).join('\r\n');
 try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:'documentos-saude.csv',data:csv});return}}catch(e){}
 try{await navigator.clipboard.writeText(csv);alert('CSV copiado para a área de transferência.')}catch(e){alert('Exportação indisponível neste ambiente.')}};
const L=ld();ov=L.ov||{};nv=L.nv||{};render();
(async()=>{try{db=await claude.use('db')}catch(e){}
 if(db){$('st').textContent=EDITAR?'Alterações são compartilhadas com quem acessa este painel.':'';
  db.collection('ov').onSnapshot(s=>{ov={};s.docs.forEach(x=>ov[x.id]=x.data());render()},()=>{});
  db.collection('nv').onSnapshot(s=>{nv={};s.docs.forEach(x=>nv[x.id]=x.data());render()},()=>{})}
 else $('st').textContent=EDITAR?'Alterações ficam salvas apenas neste navegador.':''})();
</script></body></html>
